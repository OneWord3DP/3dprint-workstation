<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D模型比赛汇总 · 3D打印工作站</title>
<style>
  :root{
    --hero:#0e6b46; --hero-ink:#ffffff; --bg:#f3f4f6; --card:#ffffff;
    --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --green:#0e6b46; --green-light:#e7f3ee;
  }
  body[data-theme="dark"]{
    --hero:#14201b; --hero-ink:#e8efeb; --bg:#0f1512; --card:#161d1a;
    --ink:#e8efeb; --muted:#8fa39a; --line:#2a3530; --green:#22c07d; --green-light:rgba(34,192,125,.12);
  }
  body[data-theme="sepia"]{
    --hero:#7a5c2e; --hero-ink:#fffdf7; --bg:#f4eee1; --card:#fffdf7;
    --ink:#3d3323; --muted:#8c7f66; --line:#e6dcc6; --green:#8a6524; --green-light:#f3ead6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .25s,color .25s}
  header{background:var(--hero);color:var(--hero-ink);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:17px}
  header .sub{font-size:12px;opacity:.85}
  .theme-pick{display:flex;gap:6px;align-items:center}
  .theme-pick .tl{font-size:11.5px;opacity:.8;margin-right:2px}
  .tbtn{width:24px;height:24px;border-radius:50%;border:2px solid rgba(128,128,128,.5);cursor:pointer;padding:0}
  .tbtn.on{border-color:currentColor;outline:2px solid rgba(128,128,128,.35)}
  .tbtn.t-light{background:linear-gradient(135deg,#fff 50%,#0e6b46 50%)}
  .tbtn.t-dark{background:linear-gradient(135deg,#161d1a 50%,#22c07d 50%)}
  .tbtn.t-sepia{background:linear-gradient(135deg,#fffdf7 50%,#7a5c2e 50%)}
  header button.rf{font-size:12.5px;color:var(--hero-ink);background:rgba(128,128,128,.18);border:1px solid rgba(128,128,128,.4);padding:6px 14px;border-radius:99px;cursor:pointer;font-weight:600;font-family:inherit}
  header button.rf:hover{background:rgba(128,128,128,.32)}
  header a.newwin{font-size:12.5px;color:var(--hero-ink);text-decoration:none;background:rgba(128,128,128,.18);border:1px solid rgba(128,128,128,.4);padding:6px 14px;border-radius:99px;font-weight:600}
  header a.newwin:hover{background:rgba(128,128,128,.32)}
  header a.back{margin-left:auto;font-size:12.5px;color:var(--hero-ink);text-decoration:none;background:rgba(128,128,128,.18);border:1px solid rgba(128,128,128,.4);padding:6px 14px;border-radius:99px;font-weight:600}
  header a.back:hover{background:rgba(128,128,128,.32)}
  .stage{padding:12px 16px 8px}
  .frame-shell{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.10);overflow:hidden}
  iframe{width:100%;height:calc(100vh - 120px);min-height:520px;border:none;display:block;background:#fff}
  .credit{text-align:center;color:var(--muted);font-size:11.5px;padding:10px 0 18px}
</style>
</head>
<body data-theme="light">
<header>
  <h1>🏆 3D模型比赛汇总</h1>
  <span class="sub">各模型平台进行/即将开始/评审中的比赛一览 · 数据源：程是少年</span>
  <div class="theme-pick">
    <span class="tl">主题</span>
    <button class="tbtn t-light on" data-t="light" title="浅色绿"></button>
    <button class="tbtn t-dark" data-t="dark" title="深色"></button>
    <button class="tbtn t-sepia" data-t="sepia" title="米色护眼"></button>
  </div>
  <button class="rf" onclick="reload()">↻ 刷新</button>
  <a class="newwin" href="https://csxiangcn-ui.github.io/-/3d-contests.html" target="_blank" rel="noopener">↗ 新窗口打开</a>
  <a class="back" href="index.html">← 返回工作站</a>
</header>
<div class="stage">
  <div class="frame-shell">
    <iframe id="frame" src="https://csxiangcn-ui.github.io/-/3d-contests.html" title="3D模型比赛汇总"></iframe>
  </div>
</div>
<div class="credit">比赛数据由「程是少年」维护并实时更新 · 整合：一言智造 &amp; 千问办公</div>
<script>
function reload(){
  const f=document.getElementById('frame');
  f.src='https://csxiangcn-ui.github.io/-/3d-contests.html?t='+Date.now();
}
const THEME_KEY='fdm_theme_v1';
function applyTheme(t){
  document.body.dataset.theme=t;
  document.querySelectorAll('.tbtn').forEach(function(b){b.classList.toggle('on',b.dataset.t===t);});
  try{localStorage.setItem(THEME_KEY,t);}catch(e){}
}
document.querySelectorAll('.tbtn').forEach(function(b){b.addEventListener('click',function(){applyTheme(b.dataset.t);});});
try{const sv=localStorage.getItem(THEME_KEY);if(sv)applyTheme(sv);}catch(e){}
</script>
</body>
</html>
