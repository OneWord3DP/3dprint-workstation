<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D打印每日热点 · 3D打印工作站</title>
<style>
/* ===== 站点统一导航与主题（与首页一致） ===== */
  :root{
    --bg:#f3f6fb; --card:#ffffff; --ink:#111827; --muted:#64748b; --line:#e4eaf2;
    --blue:#2563eb; --blue2:#4f8bfb; --blue-soft:#eaf1fe;
    --purple:#7c3aed; --purple2:#a78bfa; --purple-soft:#f2ecfd;
    --shadow-s:0 1px 2px rgba(15,23,42,.05);
    --shadow-m:0 12px 32px rgba(15,23,42,.08);
    --r:16px;
  }
  body[data-theme="dark"]{
    --bg:#0b1220; --card:#141a2b; --ink:#e7edf5; --muted:#93a3b8; --line:#26303f;
    --blue:#4d8dff; --blue2:#8ab1ff; --blue-soft:rgba(77,141,255,.14);
    --purple:#a78bfa; --purple-soft:rgba(167,139,250,.16);
    --shadow-s:0 1px 2px rgba(0,0,0,.35);
    --shadow-m:0 12px 32px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .25s,color .25s;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .topnav{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .topnav .inner{display:flex;align-items:center;gap:20px;height:64px;max-width:1280px;margin:0 auto;padding:0 28px}
  .logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;white-space:nowrap;color:var(--ink)}
  .logo .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,var(--blue),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 4px 14px rgba(37,99,235,.35)}
  .navtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  .navtabs::-webkit-scrollbar{display:none}
  .navtabs a{font-size:15px;font-weight:500;color:var(--muted);padding:8px 16px;border-radius:10px;white-space:nowrap;transition:all .15s}
  .navtabs a:hover{color:var(--blue);background:var(--blue-soft)}
  .navtabs a.active{color:var(--blue);font-weight:700;background:var(--blue-soft)}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .tbtn{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;transition:transform .15s,box-shadow .15s;background:transparent}
  .tbtn:hover{transform:scale(1.12)}
  .tbtn.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
  .tbtn.t-light{background:linear-gradient(135deg,#fff 50%,var(--blue) 50%)}
  .tbtn.t-dark{background:linear-gradient(135deg,#10182f 50%,#58a6ff 50%)}
  .page-wrap{max-width:1280px;margin:0 auto;padding:20px 20px 0}
  .page-hero{background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 52%,var(--purple) 125%);color:#fff;border-radius:var(--r);padding:22px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow-m);margin-bottom:18px}
  .page-hero h1{font-size:21px;letter-spacing:.4px}
  .page-hero .sub{font-size:13px;opacity:.9;margin-top:4px;line-height:1.6}
  .page-hero .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pbtn{font-size:12.5px;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-family:inherit;text-decoration:none;transition:background .15s}
  .pbtn:hover{background:rgba(255,255,255,.3)}
  .frame-shell{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-m);overflow:hidden;padding:10px}
  iframe{width:100%;height:calc(100vh - 190px);min-height:720px;border:none;display:block;background:#fff;border-radius:10px}
  .tip{max-width:760px;margin:22px auto;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.9;padding:0 20px}
  .credit{text-align:center;color:var(--muted);font-size:11.5px;margin:14px auto 6px;line-height:1.8}
  @media (max-width:640px){
    .topnav .inner{flex-wrap:wrap;row-gap:4px;height:auto;padding:12px 16px 8px}
    .navtabs{order:3;width:100%;flex:none}
    .nav-right{gap:8px}
    .navtabs a{padding:8px 12px}
    .page-wrap{padding:14px 12px 0}
    .page-hero{padding:18px;align-items:flex-start}
    .page-hero h1{font-size:18px}
    .page-hero .acts{margin-left:0}
    iframe{height:calc(100vh - 230px);min-height:560px}
  }
</style>
</head>
<body data-theme="light">
<nav class="topnav">
  <div class="inner">
    <a class="logo" href="index.html"><span class="mark">⬡</span>一言智造</a>
    <div class="navtabs">
      <a href="index.html#workspace">个人工作台</a>
      <a href="index.html#tools" class="active">3D打印工具</a>
      <a href="index.html#resources">资源中心</a>
      <a href="index.html#community">社区交流</a>
    </div>
    <div class="nav-right">
      <button class="tbtn t-light on" data-t="light" title="浅色模式" aria-label="浅色模式"></button>
      <button class="tbtn t-dark" data-t="dark" title="深色模式" aria-label="深色模式"></button>
    </div>
  </div>
</nav>
<div class="page-wrap">
  <div class="page-hero">
    <div>
      <h1>📰 3D打印每日热点</h1>
      <div class="sub" id="meta">每天 09:00 自动生成并同步</div>
    </div>
    <div class="acts">
      <button class="pbtn" onclick="reload()">↻ 刷新</button>
      <a class="pbtn" href="https://oneword3dp.github.io/3dprint-workstation/daily-report.html" target="_blank" rel="noopener">↗ 新窗口打开</a>
      <a class="pbtn" href="index.html">← 返回工作站</a>
    </div>
  </div>
  <div class="frame-shell">
    <iframe id="frame" src="https://oneword3dp.github.io/3dprint-workstation/daily-report.html" title="每日热点报告"></iframe>
  </div>
  <div class="tip" id="tip" style="display:none">若上方空白，说明今天的日报还在生成中（每天 09:00 自动跑），或浏览器拦截了内嵌内容，点「新窗口打开」即可查看。</div>
</div>
<div class="credit">数据源：GitHub 主版本仓库，每日自动更新 · 作者：一言智造One3DP</div>
<script>
var SRC='https://oneword3dp.github.io/3dprint-workstation/daily-report.html';
function reload(){
  var f=document.getElementById('frame');
  f.src=SRC+'?t='+Date.now();
  document.getElementById('meta').textContent='已刷新 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false});
}
(function(){
var THEME_KEY='one3dp_theme';
function applyTheme(t){
  document.body.dataset.theme=t;
  document.querySelectorAll('.tbtn').forEach(function(b){b.classList.toggle('on',b.dataset.t===t);});
  try{localStorage.setItem(THEME_KEY,t);}catch(e){}
}
document.querySelectorAll('.tbtn').forEach(function(b){b.addEventListener('click',function(){applyTheme(b.dataset.t);});});
try{var sv=localStorage.getItem(THEME_KEY);if(sv)applyTheme(sv);}catch(e){}
})();
setTimeout(function(){
  try{
    var f=document.getElementById('frame');
    var ok=false;
    try{ok=!!(f.contentDocument&&f.contentDocument.body&&f.contentDocument.body.innerHTML.trim());}catch(e){ok=true;}
    if(!ok)document.getElementById('tip').style.display='block';
  }catch(e){}
},5000);
</script>
<div class="pv-bar" style="text-align:center;color:#8a919c;font-size:12px;margin:16px auto 8px;line-height:1.8;">
  <span id="busuanzi_container_site_pv">本站总访问量 <span id="busuanzi_value_site_pv">-</span> 次 · 今日访客 <span id="busuanzi_value_site_uv">-</span> 人</span>
</div>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
